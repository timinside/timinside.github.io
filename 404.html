<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | bbweb</title>
    <link rel="icon" href="icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #111827; --bg-secondary: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af; --border: #374151; --accent: #3b82f6; }
        body { font-family: 'Manrope', sans-serif; background-color: var(--bg); color: var(--text-main); }
        .btn-primary { display: inline-block; background-color: var(--accent); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">
    <main class="flex-grow flex items-center justify-center">
        <div class="max-w-md mx-auto px-4 py-16 text-center">
            <h1 class="text-8xl font-extrabold tracking-tighter" style="color: var(--accent);">404</h1>
            <h2 class="mt-4 text-3xl font-bold tracking-tight">Page not found</h2>
            <p class="mt-4 text-lg" style="color: var(--text-muted);">The page you are looking for does not exist.</p>
            <a href="/index.html" class="btn-primary mt-8">Back to projects</a>
        </div>
    </main>
</body>
</html>
